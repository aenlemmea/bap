services:
  postgres:
    image: postgres:latest
    container_name: bap
    environment:
      POSTGRES_DB: bap_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - bap_data:/var/lib/postgresql/
volumes:
  bap_data: